openapi: 3.1.0
info:
  title: control-plane-metta — API worker lingkungan
  version: 1.0.0
  description: |
    Dipanggil **worker operations-metta** (`src/worker.ts` di repo itu) yang berjalan di host runtime, yaitu server
    tempat lingkungan milik kita berjalan. Worker menarik pekerjaan: ia mengambil satu operasi lingkungan, menjalankan
    perintah penyiapan di database lingkungannya, melaporkan langkahnya, lalu menutupnya. Control plane tidak pernah
    memanggil masuk ke operations-metta.

    File ini ditulis tangan dan merupakan sumber kebenaran. Test worker di operations-metta memvalidasi permintaannya
    terhadap file ini; mengubah salah satu sisi berarti mengubah keduanya.

    ## Tanda tangan

    Setiap permintaan ditandatangani seperti API agen (`contracts/agent/openapi.yaml`): HTTP Message Signatures
    (RFC 9421) dengan label `sig1`, komponen `"@method" "@path" "content-digest"`, parameter `created`, `keyid`, `alg`
    dalam urutan itu, `alg="rsa-v1_5-sha256"`, dan `Content-Digest: sha-256=:<base64>:` atas isi request (isi kosong
    juga). `keyid` adalah id host runtime (uuid), yang dicetak `bun dist/cli.js add-runtime-host` saat kunci publiknya
    didaftarkan. Selisih jam paling banyak 300 detik. Host yang dicabut, tidak dikenal, atau tanda tangan yang salah
    dijawab sama: `401 signature_invalid`.

    ## Antrean

    - Satu lingkungan punya paling banyak satu operasi terbuka.
    - Control plane menempatkan setiap lingkungan ke satu host saat lingkungan itu dibuat. Claim hanya membawa operasi
      lingkungan yang ditempatkan di host pemanggilnya.
    - Tenggat 30 menit, diperpanjang setiap langkah `running`. Tenggat yang lewat ditutup gagal saat antrean dibaca, dan
      lingkungannya menjadi `degraded`. Langkah dan penutupan dari worker yang tidak lagi memegang operasi dijawab
      `409 operation_not_held`; worker itu harus berhenti.
    - Penutupan `succeeded` operasi `provision` dan `migrate` membuat lingkungan `active`; `failed` membuatnya
      `degraded`. Penutupan `convert` membiarkan lingkungan `active` apa pun hasilnya, termasuk bila tenggatnya habis,
      karena demo yang gagal dikonversi masih utuh dan sedang dipakai. Penutupan `succeeded` operasi `expire`
      menghapus lunak lingkungannya (isinya boleh dibuang setelah masa tenggang, bawaannya 30 hari); `failed` tidak
      mengubah lingkungan. Penutupan `succeeded` operasi `restore` melepas hapus lunaknya dan mengembalikan status
      sebelum dihapus; `failed` membiarkannya tetap dihapus. Penutupan `succeeded` operasi `purge` mencatat
      `purged_at`; baris lingkungan dan riwayatnya tidak dihapus. Setiap penutupan membuang
      `parameters.admin.password_hash`.
    - Operasi `expire` dan `purge` tidak diminta operator. Keduanya diantrekan saat host pemegang lingkungannya
      memanggil claim, kecuali lingkungan itu masih punya operasi terbuka atau operasi yang sama gagal kurang dari
      sejam yang lalu: `expire` untuk demo yang tanggal berakhirnya lewat, `purge` untuk lingkungan bukan produksi
      yang dihapus lunak dan masa tenggangnya habis. Claim membawa `restore` dan `purge` walaupun lingkungannya sedang
      dihapus.
    - Operasi `sync_entitlements` juga tidak diminta operator. Ia diantrekan untuk lingkungan `active` yang hak module
      tenant-nya berbeda dari yang terakhir berhasil diterapkan di sana, termasuk lingkungan yang baru selesai
      disiapkan. Penutupan `succeeded` mencatat `parameters.modules` sebagai yang sudah diterapkan; status lingkungan
      tidak berubah apa pun hasilnya. Operasi `sync_entitlements` yang sukses tidak menahan antrean berikutnya; yang
      gagal ditahan sejam seperti `expire`.

    ## Operasi

    - `provision`: membuat database lingkungan, menjalankan migration Core, menulis tenant dan admin pertama, lalu
      mencatat alamatnya. Parameternya `ProvisionParameters`.
    - `migrate`: menjalankan migration Core yang belum terpasang di database lingkungan yang sudah disiapkan, sampai
      skemanya sama dengan kode worker. Parameternya `MigrateParameters`. Hanya diminta untuk lingkungan dengan
      database sendiri yang penyiapannya pernah selesai.
    - `convert`: menjadikan demo produksi di tempat. Worker memindah alamat lingkungan di runtime dari
      `<tenant_slug>.demo.<base>` ke `<tenant_slug>.<base>` dengan nama barunya; database dan isinya tidak berubah.
      Parameternya `ConvertParameters`. Jenis lingkungan di control plane baru menjadi `production` saat penutupan
      `succeeded` diterima.
    - `expire`: menonaktifkan alamat demo `<tenant_slug>.demo.<base>` di runtime, sehingga alamat itu berhenti
      melayani. Database dan isinya tidak disentuh, karena isinya masih boleh dipulihkan sampai masa tenggangnya habis.
      Parameternya `ExpireParameters`.
    - `restore`: menyalakan lagi alamat `<tenant_slug>.<base>` (produksi) atau `<tenant_slug>.<kind>.<base>` yang
      dinonaktifkan `expire`, selama alamat itu masih menunjuk database yang sama. Diminta operator untuk lingkungan
      yang dihapus lunak dan masa tenggangnya belum habis; claim membawanya walaupun lingkungannya sedang dihapus.
      Parameternya `RestoreParameters`.
    - `purge`: membuang database lingkungan secara permanen (`DROP DATABASE ... WITH (FORCE)`). Alamatnya tetap
      tercatat nonaktif sebagai nisan. Worker menolak membuang database yang masih ditunjuk alamat aktif. Database null
      (database bersama runtime) tidak pernah dibuang. Parameternya `PurgeParameters`.
    - `sync_entitlements`: menyamakan hak module tenant di database lingkungan dengan `modules`. Module di daftar
      dipasang bila belum (migration module, catatan pemasangan, duty untuk role pemilik) dan hak pakainya diberi
      tanggal berakhir `ends_on` (hari terakhir boleh dipakai; null berarti tanpa batas). Hak module yang tidak ada di
      daftar dicabut. Data yang dibuat dengan module itu tidak disentuh. Parameternya `SyncEntitlementsParameters`.
    ## Laporan host

    Worker melapor setiap beberapa menit, dan sekali saat mulai, lewat `POST /report`: rilis image yang ia jalankan,
    module yang dibawa image itu (`modules`, sumber katalog module di konsol), dan
    untuk setiap alamat lingkungan yang tercatat di runtime-nya: migration terakhir per pemilik, ukuran database, dan
    sehat atau tidak beserta sebabnya. Control plane menyimpan laporan terakhir saja. Lingkungan dicocokkan hanya di
    antara milik host itu, lewat nama database, atau lewat slug tenant dan jenis untuk database bersama; alamat yang
    tidak dikenal dihitung sebagai `unknown`, tidak dibuat.
servers:
  - url: /api/worker/v1
paths:
  /operations/claim:
    post:
      operationId: claimEnvironmentOperation
      summary: Mengambil operasi tertua yang boleh dijalankan host ini
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Operasi yang sekarang dipegang host ini sampai `lease_until`.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation:
                    $ref: '#/components/schemas/ClaimedOperation'
        '204':
          description: Tidak ada operasi yang boleh diambil.
        '401':
          $ref: '#/components/responses/SignatureInvalid'
  /report:
    post:
      operationId: reportRuntimeHost
      summary: Melaporkan rilis host dan keadaan lingkungan-lingkungannya
      parameters:
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostReport'
      responses:
        '200':
          description: Laporan tersimpan.
          content:
            application/json:
              schema:
                type: object
                required: [matched, unknown]
                properties:
                  matched:
                    type: integer
                  unknown:
                    type: integer
        '401':
          $ref: '#/components/responses/SignatureInvalid'
        '422':
          description: Isi laporan tidak sah.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: report_invalid
  /operations/{operation}/steps:
    post:
      operationId: recordEnvironmentStep
      summary: Melaporkan langkah, atau menutup operasi
      parameters:
        - name: operation
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Step'
      responses:
        '200':
          description: Langkah tercatat. `lease_until` tenggat baru untuk `running`, null untuk penutupan.
          content:
            application/json:
              schema:
                type: object
                required: [lease_until]
                properties:
                  lease_until:
                    type: [string, 'null']
                    format: date-time
        '401':
          $ref: '#/components/responses/SignatureInvalid'
        '409':
          description: Operasi tidak lagi dipegang host ini (milik host lain, sudah ditutup, atau tenggatnya lewat).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: operation_not_held
        '422':
          description: Isi langkah tidak sah.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: step_invalid
components:
  parameters:
    SignatureInput:
      name: Signature-Input
      in: header
      required: true
      schema:
        type: string
      example: 'sig1=("@method" "@path" "content-digest");created=1762700000;keyid="0196f1c2-0000-7000-8000-000000000000";alg="rsa-v1_5-sha256"'
    Signature:
      name: Signature
      in: header
      required: true
      schema:
        type: string
    ContentDigest:
      name: Content-Digest
      in: header
      required: true
      schema:
        type: string
  responses:
    SignatureInvalid:
      description: Tanda tangan, host, atau waktunya tidak sah.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: signature_invalid
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ClaimedOperation:
      type: object
      required: [id, operation, environment_id, parameters, lease_until]
      properties:
        id:
          type: string
          format: uuid
        operation:
          type: string
          enum: [provision, migrate, convert, expire, restore, purge, sync_entitlements]
        environment_id:
          type: string
          format: uuid
        lease_until:
          type: string
          format: date-time
        parameters:
          description: '`ProvisionParameters` untuk `provision`, `MigrateParameters` untuk `migrate`, `ConvertParameters` untuk `convert`, `ExpireParameters` untuk `expire`, `RestoreParameters` untuk `restore`, `PurgeParameters` untuk `purge`, `SyncEntitlementsParameters` untuk `sync_entitlements`.'
          oneOf:
            - $ref: '#/components/schemas/ProvisionParameters'
            - $ref: '#/components/schemas/MigrateParameters'
            - $ref: '#/components/schemas/ConvertParameters'
            - $ref: '#/components/schemas/ExpireParameters'
            - $ref: '#/components/schemas/RestoreParameters'
            - $ref: '#/components/schemas/PurgeParameters'
            - $ref: '#/components/schemas/SyncEntitlementsParameters'
    ProvisionParameters:
      description: |
        Permintaan penyiapan operations-metta (`provisionRequestSchema` di `src/platform/environment/` repo itu),
        apa adanya. `admin.password_hash` adalah hash bcrypt password sementara admin pertama; plaintext-nya hanya
        pernah tampil sekali di konsol.
      type: object
      required: [environment, database, client, tenant, admin]
      properties:
        environment:
          type: object
          required: [kind, name]
          properties:
            kind:
              type: string
              enum: [production, sandbox, demo]
            name:
              type: string
        database:
          type: [string, 'null']
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        client:
          type: object
          required: [id, legal_name, slug]
          properties:
            id: { type: string, format: uuid }
            legal_name: { type: string }
            slug: { type: string }
        tenant:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        admin:
          type: object
          required: [id, name, email, password_hash]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            password_hash: { type: string }
    MigrateParameters:
      type: object
      additionalProperties: false
      required: [database]
      properties:
        database:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,62}$'
    ConvertParameters:
      type: object
      additionalProperties: false
      required: [tenant_slug, database, name]
      properties:
        tenant_slug:
          type: string
        database:
          description: Database lingkungan demo; null berarti database bersama runtime.
          type: [string, 'null']
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        name:
          description: Nama lingkungan sesudah menjadi produksi.
          type: string
          minLength: 1
          maxLength: 100
    ExpireParameters:
      type: object
      additionalProperties: false
      required: [tenant_slug, database]
      properties:
        tenant_slug:
          type: string
        database:
          description: Database lingkungan demo; null berarti database bersama runtime.
          type: [string, 'null']
          pattern: '^[a-z][a-z0-9_]{0,62}$'
    RestoreParameters:
      type: object
      additionalProperties: false
      required: [tenant_slug, kind, database]
      properties:
        tenant_slug:
          type: string
        kind:
          type: string
          enum: [production, sandbox, demo]
        database:
          description: Database lingkungan; null berarti database bersama runtime.
          type: [string, 'null']
          pattern: '^[a-z][a-z0-9_]{0,62}$'
    PurgeParameters:
      type: object
      additionalProperties: false
      required: [tenant_slug, kind, database]
      properties:
        tenant_slug:
          type: string
        kind:
          type: string
          enum: [sandbox, demo]
        database:
          description: Database lingkungan; null berarti database bersama runtime, yang tidak pernah dibuang.
          type: [string, 'null']
          pattern: '^[a-z][a-z0-9_]{0,62}$'
    SyncEntitlementsParameters:
      type: object
      additionalProperties: false
      required: [tenant_id, database, modules]
      properties:
        tenant_id:
          type: string
          format: uuid
        database:
          description: Database lingkungan; null berarti database bersama runtime.
          type: [string, 'null']
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        modules:
          description: Seluruh hak module tenant yang masih hidup, urut `module_id`. Daftar kosong mencabut semuanya.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [module_id, ends_on]
            properties:
              module_id:
                type: string
              ends_on:
                description: Hari terakhir module boleh dipakai; null berarti tanpa batas.
                type: [string, 'null']
                format: date
    HostReport:
      type: object
      additionalProperties: false
      required: [release, environments]
      properties:
        release:
          description: Rilis image operations-metta yang dijalankan host ini.
          type: string
          minLength: 1
          maxLength: 80
        modules:
          description: |
            Module yang dibawa image host ini dan boleh dijual. Opsional bagi worker lama; laporan tanpa daftar ini tidak
            mengubah katalog.
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [id, name, description]
            properties:
              id:
                type: string
                pattern: '^[a-z][a-z0-9-]{0,79}$'
              name:
                type: string
                minLength: 1
                maxLength: 150
              description:
                type: [string, 'null']
                maxLength: 1000
        environments:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [tenant_slug, kind, database, healthy, problem, size_bytes, migrations]
            properties:
              tenant_slug:
                type: string
              kind:
                type: string
                enum: [production, sandbox, demo]
              database:
                description: Database lingkungan; null berarti database bersama runtime.
                type: [string, 'null']
              healthy:
                type: boolean
              problem:
                description: Sebab tidak sehat, dalam bahasa yang dibaca operator.
                type: [string, 'null']
                maxLength: 500
              size_bytes:
                type: [integer, 'null']
                minimum: 0
              migrations:
                description: Migration terakhir per pemilik, misalnya `{ "core": "0013_environment_route_disabled.sql" }`.
                type: object
                additionalProperties:
                  type: string
    Step:
      type: object
      additionalProperties: false
      required: [status, step]
      properties:
        status:
          type: string
          enum: [running, succeeded, failed]
        step:
          type: string
          minLength: 1
          maxLength: 60
        failure_message:
          type: [string, 'null']
          maxLength: 4000
