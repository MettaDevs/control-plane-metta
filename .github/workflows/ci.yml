name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: control_plane_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d control_plane_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: control_plane_ci
      DB_USERNAME: ci
      DB_PASSWORD: ci-only-not-a-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Entry peramban dan kontrak API layar di-commit supaya TypeScript mengenalnya; berkas yang tertinggal dari kodenya
      # ditolak di sini, sebelum typecheck dan build memakainya.
      - name: Check generated client files
        run: bun run check:generated

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check

      - name: Check boundaries
        run: bun run check:boundaries

      - name: Migrate an empty database
        run: bun run migrate

      - name: Migrate again without changes
        run: |
          output=$(bun run migrate)
          echo "$output"
          grep -qx 'database is up to date' <<< "$output"

      - name: Test against the migrated database
        run: bun run test

      # Proses server dan layar konsol, jadi halaman yang rusak gagal di sini.
      - name: Build
        run: bun run build
