# SaaS dev: control-plane-metta (konsol, agen, portal klien) dan satu host runtime operations-metta, di
# /opt/metta-saas-dev di server dev1. Dipasang dan dijalankan deploy.sh di folder yang sama; jangan sunting salinannya di
# server, sunting berkas ini. Port hanya dibuka di 172.17.0.1 untuk Traefik Dokploy (route di
# /etc/dokploy/traefik/dynamic/operations-metta.yml). Secret ada di secrets/*.env dan secrets/worker.pem (0600, root);
# berkas ini tidak memuat secret.
name: metta-saas-dev
services:
  cp-db:
    image: postgres:17
    restart: unless-stopped
    env_file: secrets/cp-db.env
    volumes: [cp-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U controlplane -d controlplane]
      interval: 5s
      retries: 20
  cp-console:
    image: metta-saas-dev/control-plane:${CP_TAG}
    restart: unless-stopped
    env_file: secrets/cp.env
    command: [bun, dist/console.js]
    ports: ['172.17.0.1:9101:8000']
    depends_on: { cp-db: { condition: service_healthy } }
  cp-portal:
    image: metta-saas-dev/control-plane:${CP_TAG}
    restart: unless-stopped
    env_file: secrets/cp.env
    command: [bun, dist/portal.js]
    ports: ['172.17.0.1:9104:8000']
    depends_on: { cp-db: { condition: service_healthy } }
  cp-agent:
    image: metta-saas-dev/control-plane:${CP_TAG}
    restart: unless-stopped
    env_file: secrets/cp.env
    command: [bun, dist/agent.js]
    ports: ['172.17.0.1:9102:8000']
    depends_on: { cp-db: { condition: service_healthy } }
  ops-db:
    image: postgres:17
    restart: unless-stopped
    env_file: secrets/ops-db.env
    volumes: [ops-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U operations -d runtime]
      interval: 5s
      retries: 20
  ops-app:
    image: metta-saas-dev/operations:${OPS_TAG}
    restart: unless-stopped
    env_file: secrets/ops.env
    # Pembuat PDF dokumen cetak operations-metta (src/platform/reporting/). Tanpa ini cetak hanya berupa Word.
    environment:
      RENDERER_URL: http://ops-renderer:3000
    networks: [default, renderer]
    ports: ['172.17.0.1:9103:8000']
    depends_on:
      ops-db: { condition: service_healthy }
      ops-renderer: { condition: service_healthy }
  # Gotenberg (LibreOffice) mengubah dokumen cetak Word menjadi PDF. Tanpa status dan tanpa tenant; satu untuk host
  # runtime ini. Hanya di jaringan renderer yang tidak punya jalan keluar, supaya layout unggahan tenant tidak dapat
  # memancingnya mengambil sumber dari luar. LibreOffice dinyalakan saat container mulai (sekitar 13 detik), bukan
  # pada klik cetak pertama.
  ops-renderer:
    image: gotenberg/gotenberg:9.10.0-libreoffice
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    command:
      - gotenberg
      - --libreoffice-auto-start=true
      - --libreoffice-restart-after=50
      - --libreoffice-max-queue-size=10
      - --libreoffice-max-memory=768MB
      - --pdf-disable-routes=true
      - --webhook-disable=true
      - --api-disable-download-from=true
      - --api-timeout=35s
    networks: [renderer]
    healthcheck:
      test: [CMD, curl, -fs, http://localhost:3000/health]
      interval: 5s
      retries: 30
  ops-worker:
    image: metta-saas-dev/operations:${OPS_TAG}
    restart: unless-stopped
    env_file: [secrets/ops.env, secrets/worker.env]
    command: [bun, dist/worker.js]
    volumes: ['./secrets/worker.pem:/run/worker.pem:ro']
    depends_on:
      ops-db: { condition: service_healthy }
      cp-agent: { condition: service_started }
networks:
  renderer:
    internal: true
volumes:
  cp-db:
  ops-db:
